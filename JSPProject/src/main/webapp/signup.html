<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SignUp</title>
</head>
<body>
	<form action="SignUp" method="post">
		<h2>SignUp</h2>
		<label for="username">User Name : </label>

		<input name="button" type="submit" value="Sign Up">
	</form>
</body>
</html>
